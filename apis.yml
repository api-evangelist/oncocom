name: Onco.com
description: >-
  Onco.com is a comprehensive cancer care platform operated by Apollo Hospitals
  Enterprise Ltd that connects cancer patients across India with oncologists and
  treatment services. The platform offers priority expert oncology consultations,
  pan-India cancer medicine delivery at discounted rates, diagnostic testing and
  imaging, curated treatment packages with negotiated hospital rates, and the
  CanWin peer support group for survivors and caregivers. Onco.com reports a
  network of 400+ oncologists and 23+ treatment centers, having served more than
  100,000 patients. It also publishes extensive patient-education content covering
  many cancer types (breast, lung, blood, prostate, colon, and others) through its
  About Cancer library and blog. This profile was surfaced as an Accel portfolio
  company; the platform is consumer/patient facing and does not publish a public
  developer API, developer portal, or machine-readable API specification.
